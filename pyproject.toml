[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "athenia-worker"
version = "0.1.0"
description = "Private Codex CLI worker for Athenia agentic tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Athenia Contributors" }
]
dependencies = [
  "httpx>=0.27,<1",
  "qrcode>=7.4,<9",
  "websockets>=15,<16"
]

[project.scripts]
athenia-worker = "athenia_worker.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
